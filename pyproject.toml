[project]
name = "mcp-toolhub"
version = "0.1.0"
description = "A secure stdio MCP gateway for workspace, Git, and approved command tools"
readme = "README.md"
authors = [
    { name = "asxvgxkep", email = "2212448547@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
    "platformdirs>=4,<5",
    "pydantic>=2.12,<3",
]

[project.scripts]
mcp-toolhub = "mcp_toolhub.cli:main"
mcp-toolhub-admin = "mcp_toolhub.admin:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
